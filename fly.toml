# Fly.io config — Express API for GenWeb.
# See /Users/pream/.claude/plans/task-notification-task-id-bromzzwdf-tas-reactive-bubble.md
# for migration context.

app = "genweb-api"
primary_region = "bom"

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "8080"
  R2_BUCKET_NAME = "genweb-projects"
  R2_HOSTING_BUCKET = "genweb-hosting"
  R2_SITES_BUCKET = "genweb-sites"
  R2_PUBLIC_DOMAIN = "pub-r2.genweb.in"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    grace_period = "30s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/api/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
