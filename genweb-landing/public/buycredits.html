<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buy Credits - GenWeb</title>
    <link href="./styles.css" rel="stylesheet">
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
    <style>
        .loader {
            border: 3px solid rgba(255,255,255,0.3);
            border-top: 3px solid #ffffff;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="bg-gray-50 min-h-screen flex items-center justify-center font-sans">
    <div class="max-w-md w-full bg-white rounded-xl shadow-lg overflow-hidden p-8 mx-4">
        <div class="text-center mb-8">
            <div class="mx-auto w-12 h-12 bg-indigo-100 rounded-full flex items-center justify-center mb-4">
                <svg class="w-6 h-6 text-indigo-600" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
            </div>
            <h1 class="text-2xl font-bold text-gray-900">Complete Purchase</h1>
            <p class="text-gray-500 mt-2">GenWeb Wallet Top-up</p>
        </div>

        <div id="summary" class="bg-gray-50 p-6 rounded-lg border border-gray-200 mb-8 transition-opacity duration-200">
            <div class="flex justify-between items-center mb-4">
                <span class="text-gray-600">Credits</span>
                <span id="credits-amount" class="font-semibold text-gray-900">...</span>
            </div>
            <div class="flex justify-between items-center pt-4 border-t border-gray-200">
                <span class="text-gray-900 font-bold">Total Pay</span>
                <span id="total-amount" class="text-2xl font-bold text-indigo-600">...</span>
            </div>
        </div>

        <div id="error-message" class="hidden mb-4 p-3 bg-red-50 border border-red-200 text-red-700 rounded-md text-sm text-center"></div>
        <div id="success-message" class="hidden mb-4 p-4 bg-green-50 border border-green-200 text-green-700 rounded-md text-center">
            <div class="flex justify-center mb-2">
                <svg class="w-8 h-8 text-green-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
            </div>
            <p class="font-semibold">Payment Successful!</p>
            <p class="text-sm mt-1">Credits have been added to your wallet.</p>
            <button onclick="window.close()" class="mt-4 text-indigo-600 hover:text-indigo-800 font-medium text-sm">Close Window</button>
        </div>

        <button id="pay-btn" class="w-full bg-indigo-600 text-white font-bold py-3 px-4 rounded-lg hover:bg-indigo-700 transition-colors flex justify-center items-center shadow-md">
            <span>Pay Now</span>
        </button>
    </div>

    <script>
        // --- CONFIGURATION ---
        const API_BASE = 'https://sgp1-backend-719340208040.asia-south1.run.app';
        // IMPORTANT: Replace with your actual Razorpay Key ID
        const RAZORPAY_KEY = 'rzp_live_S5yir4SYWTzG2D'; 
        // ---------------------

        // URL Params
        const params = new URLSearchParams(window.location.search);
        const uid = params.get('uid');
        const token = params.get('token');
        const amount = params.get('amount');
        const credits = params.get('credits');

        // Elements
        const creditsEl = document.getElementById('credits-amount');
        const totalEl = document.getElementById('total-amount');
        const payBtn = document.getElementById('pay-btn');
        const errorEl = document.getElementById('error-message');
        const successEl = document.getElementById('success-message');

        // Init Validation
        if (!uid || !token || !amount) {
            showError('Invalid request. Missing parameters.');
            payBtn.disabled = true;
            payBtn.classList.add('opacity-50', 'cursor-not-allowed');
        } else {
            creditsEl.textContent = credits || amount; 
            totalEl.textContent = '₹' + amount;
        }

        function showError(msg) {
            errorEl.textContent = msg;
            errorEl.classList.remove('hidden');
        }

        function setLoading(isLoading) {
            if (isLoading) {
                payBtn.innerHTML = '<div class="loader"></div>';
                payBtn.disabled = true;
                payBtn.classList.add('opacity-75');
            } else {
                payBtn.innerHTML = '<span>Pay Now</span>';
                payBtn.disabled = false;
                payBtn.classList.remove('opacity-75');
            }
        }

        function showSuccess() {
            successEl.classList.remove('hidden');
            payBtn.classList.add('hidden');
            document.getElementById('summary').classList.add('opacity-50');
        }

        // Pay Handler
        payBtn.addEventListener('click', async () => {
            if (payBtn.disabled) return;
            
            setLoading(true);
            errorEl.classList.add('hidden');

            try {
                // 1. Create Order
                const orderRes = await fetch(`${API_BASE}/api/credits/buy`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({
                        amount: parseInt(amount),
                        credits: parseInt(credits || amount)
                    })
                });

                if (!orderRes.ok) {
                    const errData = await orderRes.json();
                    throw new Error(errData.error || 'Failed to create order');
                }
                const { order } = await orderRes.json();

                // 2. Open Razorpay
                const options = {
                    key: RAZORPAY_KEY,
                    amount: order.amount,
                    currency: order.currency,
                    name: "GenWeb Credits",
                    description: `Purchase ${credits} Credits`,
                    order_id: order.id,
                    handler: async function (response) {
                        try {
                            // 3. Verify Payment
                            const verifyRes = await fetch(`${API_BASE}/api/credits/verify`, {
                                method: 'POST',
                                headers: {
                                    'Content-Type': 'application/json',
                                    'Authorization': `Bearer ${token}`
                                },
                                body: JSON.stringify({
                                    orderId: response.razorpay_order_id,
                                    paymentId: response.razorpay_payment_id,
                                    signature: response.razorpay_signature,
                                    credits: parseInt(credits || amount),
                                    amount: parseInt(amount)
                                })
                            });

                            if (!verifyRes.ok) {
                                throw new Error('Verification failed');
                            }
                            
                            showSuccess();
                        } catch (err) {
                            console.error(err);
                            showError('Payment verification failed. Please contact support.');
                            setLoading(false);
                        }
                    },
                    prefill: {
                        contact: '', 
                        email: ''
                    },
                    theme: {
                        color: "#4f46e5"
                    },
                    modal: {
                        ondismiss: function() {
                            setLoading(false);
                        }
                    }
                };

                const rzp = new Razorpay(options);
                rzp.on('payment.failed', function (response){
                    showError(response.error.description);
                    setLoading(false);
                });
                rzp.open();

            } catch (err) {
                console.error(err);
                showError(err.message || 'Something went wrong. Please try again.');
                setLoading(false);
            }
        });
    </script>
</body>
</html>
